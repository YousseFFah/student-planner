<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Planner - Register</title>

  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-page" data-title-key="registerTitle">
  <main class="auth-container">

    <button
      class="language-toggle"
      type="button"
      data-language-toggle
    >العربية</button>

    <section class="auth-card register-card">

      <div class="auth-brand">
        <div class="brand-mark">SP</div>

        <div>
          <strong>Student Planner</strong>
          <span data-i18n="brandTagline">Stay on track</span>
        </div>
      </div>

      <div class="auth-heading">
        <span class="eyebrow" data-i18n="getStarted">
          Get started
        </span>

        <h1 data-i18n="createAccountHeading">
          Create your account
        </h1>

        <p data-i18n="registerDescription">
          Start organizing your university life in one place.
        </p>
      </div>

      <form id="registerForm" class="auth-form">

        <div class="form-group">
          <label for="registerName" data-i18n="fullName">
            Full Name
          </label>

          <input
            id="registerName"
            type="text"
            data-i18n-placeholder="enterName"
            placeholder="Enter your name"
            autocomplete="name"
            maxlength="100"
            required
          >
        </div>

        <div class="form-group">
          <label for="registerEmail" data-i18n="email">
            Email
          </label>

          <input
            id="registerEmail"
            type="email"
            data-i18n-placeholder="enterEmail"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="registerPassword" data-i18n="password">
            Password
          </label>

          <div class="password-field">
            <input
              id="registerPassword"
              type="password"
              data-i18n-placeholder="createPassword"
              placeholder="Create a password"
              autocomplete="new-password"
              minlength="6"
              required
            >

            <button
              id="toggleRegisterPassword"
              class="password-toggle"
              type="button"
              data-i18n-aria-label="show"
              aria-label="Show password"
            >Show</button>
          </div>

          <span class="input-hint" data-i18n="useSixCharacters">
            Use at least 6 characters.
          </span>
        </div>

        <div class="form-group">
          <label for="confirmPassword" data-i18n="confirmPassword">
            Confirm Password
          </label>

          <div class="password-field">
            <input
              id="confirmPassword"
              type="password"
              data-i18n-placeholder="confirmPassword"
              placeholder="Confirm your password"
              autocomplete="new-password"
              minlength="6"
              required
            >

            <button
              id="toggleConfirmPassword"
              class="password-toggle"
              type="button"
              data-i18n-aria-label="show"
              aria-label="Show password"
            >Show</button>
          </div>
        </div>

        <div
          id="registerError"
          class="auth-message error-message"
          role="alert"
        ></div>

        <div
          id="registerSuccess"
          class="auth-message success-message"
          role="status"
        ></div>

        <button
          id="registerButton"
          class="primary-btn auth-submit"
          type="submit"
          data-i18n="createAccount"
        >Create Account</button>

      </form>

      <div class="auth-footer">
        <span data-i18n="haveAccount">
          Already have an account?
        </span>

        <a href="login.html" data-i18n="signIn">
          Sign in
        </a>
      </div>

    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/auth-pages.js"></script>
</body>
</html>
