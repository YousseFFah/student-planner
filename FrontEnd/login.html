<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Planner - Login</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-page">

  <main class="auth-container">

    <section class="auth-card">

      <div class="auth-brand">
        <div class="brand-mark">SP</div>

        <div>
          <strong>Student Planner</strong>
          <span>Stay on track</span>
        </div>
      </div>

      <div class="auth-heading">
        <span class="eyebrow">Welcome back</span>

        <h1>Sign in to your account</h1>

        <p>
          Keep track of your courses, tasks, assessments, and progress.
        </p>
      </div>

      <form id="loginForm" class="auth-form">

        <div class="form-group">
          <label for="loginEmail">Email</label>

          <input
            id="loginEmail"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>

          <div class="password-field">
            <input
              id="loginPassword"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              id="toggleLoginPassword"
              class="password-toggle"
              type="button"
              aria-label="Show password"
            >
              Show
            </button>
          </div>
        </div>

        <div
          id="loginError"
          class="auth-message error-message"
          role="alert"
        ></div>

        <button
          id="loginButton"
          class="primary-btn auth-submit"
          type="submit"
        >
          Sign In
        </button>

      </form>

      <div class="auth-footer">
        <span>Don't have an account?</span>

        <a href="register.html">
          Create one
        </a>
      </div>

    </section>

  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/auth-pages.js"></script>

</body>
</html>
