<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Planner - Login</title>

  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-page" data-title-key="loginTitle">
  <main class="auth-container">

    <button
      class="language-toggle"
      type="button"
      data-language-toggle
    >العربية</button>

    <section class="auth-card">

      <div class="auth-brand">
        <div class="brand-mark">SP</div>

        <div>
          <strong>Student Planner</strong>
          <span data-i18n="brandTagline">Stay on track</span>
        </div>
      </div>

      <div class="auth-heading">
        <span class="eyebrow" data-i18n="welcomeBack">
          Welcome back
        </span>

        <h1 data-i18n="signInHeading">
          Sign in to your account
        </h1>

        <p data-i18n="loginDescription">
          Keep track of your courses, tasks, assessments, and progress.
        </p>
      </div>

      <form id="loginForm" class="auth-form">

        <div class="form-group">
          <label for="loginEmail" data-i18n="email">Email</label>

          <input
            id="loginEmail"
            type="email"
            data-i18n-placeholder="enterEmail"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="loginPassword" data-i18n="password">
            Password
          </label>

          <div class="password-field">
            <input
              id="loginPassword"
              type="password"
              data-i18n-placeholder="enterPassword"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              id="toggleLoginPassword"
              class="password-toggle"
              type="button"
              data-i18n-aria-label="show"
              aria-label="Show password"
            >Show</button>
          </div>
        </div>

        <div
          id="loginError"
          class="auth-message error-message"
          role="alert"
        ></div>

        <button
          id="loginButton"
          class="primary-btn auth-submit"
          type="submit"
          data-i18n="signIn"
        >Sign In</button>

      </form>

      <div class="auth-footer">
        <span data-i18n="noAccount">Don't have an account?</span>

        <a href="register.html" data-i18n="createOne">
          Create one
        </a>
      </div>

    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/auth-pages.js"></script>
</body>
</html>
